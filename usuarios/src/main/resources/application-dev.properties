spring.application.name=usuarios

server.port=8081
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:4200}
app.frontend.url=${FRONTEND_URL:http://localhost:4200}

email.api.url=${EMAIL_API_URL:https://api.brevo.com/v3/smtp/email}
email.api.key=${MAIL_API:${EMAIL_API_KEY:}}
email.sender.name=${EMAIL_SENDER_NAME:ESI Entradas}
email.sender.address=${MAIL_USER:${EMAIL_SENDER_ADDRESS:no-reply@example.com}}

spring.datasource.url=jdbc:h2:file:./data/esiusuarios-dev;MODE=MSSQLServer;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.error.include-message=always
